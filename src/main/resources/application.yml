server:
  port: 9003                        # Gateway listens on 9003

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    reactor.netty: DEBUG
    io.gateway_service: DEBUG

spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: redis               # <-- remove if Redis has no password
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/yaper

  cloud:
    gateway:
      default-filters:
        - RemoveRequestHeader=Cookie
        - GlobalLoggingFilterFactory      # ? Role filter NOT global anymore
        - TenantIdPropagatorFilterFactory
      routes:
        # ?? User-Service: public endpoints (no role check) ??????????????
        - id: user-service
          uri: http://localhost:9001
          predicates:
            - Path=/api/v1/auth/**, /api/v1/profile/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user

        # ?? Product-Service: protected (role check + rate-limit + CB) ??
        - id: product-service
          uri: http://localhost:9002
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**
          filters:
            - name: RoleFilterFactory          # ? separate name
              args:
                roles: ADMIN,MERCHANT          # ? roles passed here
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
            - name: CircuitBreaker
              args:
                name: productServiceCB
                fallbackUri: forward:/fallback/product

        # ?? Inventory-Service: protected (role check + rate-limit + CB) ??
        - id: inventory-service
          uri: http://localhost:9006
          predicates:
            - Path=/api/v1/inventory/**, /api/v1/inventory/**
          filters:
            - name: RoleFilterFactory          # ? separate name
              args:
                roles: ADMIN,MERCHANT          # ? roles passed here
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
            - name: CircuitBreaker
              args:
                name: inventoryServiceCB
                fallbackUri: forward:/fallback/inventory

        # ?? Payment-Service: protected (role check + rate-limit + CB) ??
        - id: payment-service
          uri: http://localhost:9004
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: RoleFilterFactory          # ? separate name
              args:
                roles: ADMIN,MERCHANT          # ? roles passed here
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
            - name: CircuitBreaker
              args:
                name: paymentServiceCB
                fallbackUri: forward:/fallback/payment
        # ?? Payment-Service: protected (role check + rate-limit + CB) ??
        - id: FlowTrack
          uri: http://localhost:9010
          predicates:
            - Path=/api/v1/flowtrack/**
          filters:
            - name: RoleFilterFactory          # ? separate name
              args:
                roles: ADMIN,MERCHANT          # ? roles passed here
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
            - name: CircuitBreaker
              args:
                name: FlowTrackCB
                fallbackUri: forward:/fallback/flowtrack
      # ?? Global CORS ???????????????????????????????????????????????????
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "https://your-frontend.com"
            allowedMethods: [ GET, POST, PATCH, DELETE ]
            allowedHeaders: "*"
            allowCredentials: true

# ?? Resilience4j circuit-breaker settings (unchanged) ??????????????????
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

    instances:
      userServiceCB:
        baseConfig: default
        slowCallDurationThreshold: 3s
      productServiceCB:
        baseConfig: default
        slowCallDurationThreshold: 3s